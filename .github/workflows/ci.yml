name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recall_test
          POSTGRES_PASSWORD: recall_test
          POSTGRES_DB: recall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recall_test -d recall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        env:
          RECALL_TEST_POSTGRES_URL: postgresql://recall_test:recall_test@127.0.0.1:5432/recall_test
        run: pnpm --filter "./artifacts/api-server" run test

      - name: Frontend unit tests
        run: pnpm --filter "./artifacts/recall-app" run test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/recall-e2e exec playwright install --with-deps chromium

      - name: Smoke against production
        working-directory: e2e
        env:
          E2E_BASE_URL: https://recall-app.net
        run: pnpm test

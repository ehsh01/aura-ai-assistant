name: Deploy Recall App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/**"
      - "lib/**"
      - "scripts/**"
      - "nginx-recall-app.conf"
      - "DEPLOYMENT.md"
      - ".github/workflows/deploy-recall-app.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run when the deploy key is configured, so pushes don't fail for
    # forks/contributors without secret access.
    env:
      HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Check deploy key
        id: guard
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "DEPLOY_SSH_KEY not set; skipping deploy." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to DigitalOcean droplet
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 159.223.130.69
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # After running scripts/setup-recall-deploy-user.sh and verifying, you can
          # switch username to `recall` (or set an optional DEPLOY_SSH_USER secret)
          # without removing root SSH access.
          script: |
            cd /var/www/recall-app
            # Pull first so the deploy script itself (migrations list, etc.) is current.
            # Running an already-started bash file after git pull keeps the pre-pull version.
            git pull --ff-only
            RECALL_DEPLOY_ALREADY_PULLED=1 bash scripts/deploy-recall-app.sh

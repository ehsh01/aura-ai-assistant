kind = "web"
previewPath = "/"
title = "Recall — AI Personal Assistant"
version = "1.0.0"
id = "artifacts/recall-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20991

[services.development]
run = "pnpm --filter @workspace/recall-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recall-app", "run", "build" ]
publicDir = "artifacts/recall-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20991"
BASE_PATH = "/"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.7.0
  description: Recall API — health, auth, notebooks, notes, tasks, capture, memory, projects, and AI operations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI operations (OpenAI-backed, degrades gracefully when unconfigured)
  - name: auth
    description: User authentication
  - name: notebooks
    description: User notebooks (Evernote imports and manual collections)
  - name: notes
    description: User notes (persisted)
  - name: tasks
    description: User tasks (persisted)
  - name: capture
    description: Universal capture and AI Inbox operations
  - name: memory
    description: Permanent life memories (teach once, ask forever)
  - name: projects
    description: User projects and command-center organization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out and clear session cookie
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not authenticated
  /extension-tokens:
    get:
      operationId: listExtensionTokens
      tags: [auth]
      summary: List browser-extension capture tokens
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Extension token metadata (never raw token values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListExtensionTokensResponse"
    post:
      operationId: createExtensionToken
      tags: [auth]
      summary: Create a capture-only browser-extension token
      description: The raw token is returned once. Only its SHA-256 hash is stored.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExtensionTokenRequest"
      responses:
        "201":
          description: Extension token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateExtensionTokenResponse"
  /extension-tokens/{tokenId}:
    delete:
      operationId: revokeExtensionToken
      tags: [auth]
      summary: Revoke a browser-extension token
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tokenId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "404":
          description: Token not found
  /captures:
    post:
      operationId: ingestRawCapture
      tags: [capture]
      summary: Store a raw capture and queue extraction
      description: Raw source is committed before any AI processing begins.
      security:
        - bearerAuth: []
        - extensionTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRawCaptureRequest"
      responses:
        "201":
          description: Raw capture stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRawCaptureResponse"
    get:
      operationId: listRawCaptures
      tags: [capture]
      summary: List raw captures
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/CaptureProcessedStatus"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Raw captures
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RawCapture"
                required: [items]
  /captures/{captureId}:
    get:
      operationId: getRawCapture
      tags: [capture]
      summary: Get a raw capture
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: captureId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Raw capture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawCapture"
        "404":
          description: Capture not found
    patch:
      operationId: updateRawCaptureStatus
      tags: [capture]
      summary: Update mutable processing state for a raw capture
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: captureId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRawCaptureRequest"
      responses:
        "200":
          description: Updated raw capture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawCapture"
  /captures/{captureId}/retry-extraction:
    post:
      operationId: retryRawCaptureExtraction
      tags: [capture]
      summary: Retry extraction for a raw capture
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: captureId
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Extraction queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                    enum: [queued]
                required: [jobId, status]
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: AI availability
      description: Whether OpenAI is configured and which model is active
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with Recall
      description: Multi-turn chat with optional task/note context and tool calling
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
  /ai/notes/summarize:
    post:
      operationId: summarizeNote
      tags: [ai]
      summary: Summarize note content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeNoteRequest"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarizeNoteResponse"
  /ai/notes/title:
    post:
      operationId: generateNoteTitle
      tags: [ai]
      summary: Generate a note title from content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateNoteTitleRequest"
      responses:
        "200":
          description: Title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateNoteTitleResponse"
  /ai/tasks/extract:
    post:
      operationId: extractTasks
      tags: [ai]
      summary: Extract actionable tasks from text
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTasksRequest"
      responses:
        "200":
          description: Extracted tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTasksResponse"
  /ai/search/semantic:
    post:
      operationId: semanticSearch
      tags: [ai]
      summary: Semantic search over provided items
      description: Ranks items by embedding similarity (no persistence required)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticSearchRequest"
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticSearchResponse"
  /ai/dashboard/digest:
    post:
      operationId: dashboardDigest
      tags: [ai]
      summary: Daily dashboard digest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardDigestRequest"
      responses:
        "200":
          description: Digest text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDigestResponse"
  /ai/generate-work-note:
    post:
      operationId: generateWorkNote
      tags: [ai]
      summary: Generate IT work-note outputs from rough troubleshooting notes
      description: Uses only the provided text; does not automatically include the user's note library.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWorkNoteRequest"
      responses:
        "200":
          description: Work note variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateWorkNoteResponse"
  /notebooks:
    get:
      operationId: listNotebooks
      tags: [notebooks]
      summary: List notebooks for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notebooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookListResponse"
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallNote"
  /notes/bulk:
    post:
      operationId: bulkUpsertNotes
      tags: [notes]
      summary: Bulk create or update notes (import / migration)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkNotesRequest"
      responses:
        "200":
          description: Upserted notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
  /notes/import/enex:
    post:
      operationId: importEnexNotes
      tags: [notes]
      summary: Import notes from Evernote ENEX XML
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportEnexRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportEnexResponse"
        "400":
          description: No notes parsed from file
  /notes/{noteId}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a full note by id
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallNote"
        "404":
          description: Note not found
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallNote"
        "404":
          description: Note not found
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Note not found
  /capture:
    post:
      operationId: createCapture
      tags: [capture]
      summary: Capture a raw thought, task, reminder, or reference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaptureRequest"
      responses:
        "201":
          description: Created capture item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallCaptureItem"
  /capture/inbox:
    get:
      operationId: listCaptureInbox
      tags: [capture]
      summary: List pending AI Inbox capture items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Capture inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureInboxResponse"
  /capture/{captureId}:
    patch:
      operationId: updateCapture
      tags: [capture]
      summary: Update an AI Inbox capture item
      security:
        - bearerAuth: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaptureRequest"
      responses:
        "200":
          description: Updated capture item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallCaptureItem"
        "404":
          description: Capture item not found
  /capture/{captureId}/accept:
    post:
      operationId: acceptCapture
      tags: [capture]
      summary: Accept a capture item into notes or tasks
      security:
        - bearerAuth: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCaptureRequest"
      responses:
        "200":
          description: Accepted capture item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptCaptureResponse"
        "404":
          description: Capture item not found
  /memory:
    get:
      operationId: listMemories
      tags: [memory]
      summary: List permanent life memories
      security:
        - bearerAuth: []
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeMemoryListResponse"
    post:
      operationId: createMemory
      tags: [memory]
      summary: Teach Recall a permanent memory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLifeMemoryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeMemory"
  /memory/export.md:
    get:
      operationId: exportMemoriesMarkdown
      tags: [memory]
      summary: Download growing Life File markdown
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Markdown Life File
          content:
            text/markdown:
              schema:
                type: string
  /memory/classify:
    post:
      operationId: classifyMemory
      tags: [memory]
      summary: Suggest domain and title for raw memory text
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyMemoryRequest"
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyMemoryResponse"
  /memory/{memoryId}:
    get:
      operationId: getMemory
      tags: [memory]
      summary: Get a life memory
      security:
        - bearerAuth: []
      parameters:
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeMemory"
        "404":
          description: Not found
    patch:
      operationId: updateMemory
      tags: [memory]
      summary: Update a life memory
      security:
        - bearerAuth: []
      parameters:
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLifeMemoryRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeMemory"
        "404":
          description: Not found
    delete:
      operationId: deleteMemory
      tags: [memory]
      summary: Delete a life memory
      security:
        - bearerAuth: []
      parameters:
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallProject"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project summary
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallProject"
        "404":
          description: Project not found
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallTask"
  /tasks/bulk:
    post:
      operationId: bulkUpsertTasks
      tags: [tasks]
      summary: Bulk create or update tasks (migration)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTasksRequest"
      responses:
        "200":
          description: Upserted tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallTask"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Task not found
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: cookie
      name: recall_session
      description: HttpOnly Recall browser session cookie.
    extensionTokenAuth:
      type: http
      scheme: bearer
      description: Revocable capture-only token accepted only by POST /captures.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
      required:
        - id
        - email
        - name
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - email
        - password
        - name
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    ExtensionToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [capture:create]
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string

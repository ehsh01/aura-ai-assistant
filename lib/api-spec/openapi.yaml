openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.6.0
  description: Recall API — health, auth, notebooks, notes, tasks, capture, projects, and AI operations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI operations (OpenAI-backed, degrades gracefully when unconfigured)
  - name: auth
    description: User authentication
  - name: notebooks
    description: User notebooks (Evernote imports and manual collections)
  - name: notes
    description: User notes (persisted)
  - name: tasks
    description: User tasks (persisted)
  - name: capture
    description: Universal capture and AI Inbox operations
  - name: projects
    description: User projects and command-center organization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not authenticated
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: AI availability
      description: Whether OpenAI is configured and which model is active
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with Recall
      description: Multi-turn chat with optional task/note context and tool calling
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
  /ai/notes/summarize:
    post:
      operationId: summarizeNote
      tags: [ai]
      summary: Summarize note content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeNoteRequest"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarizeNoteResponse"
  /ai/notes/title:
    post:
      operationId: generateNoteTitle
      tags: [ai]
      summary: Generate a note title from content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateNoteTitleRequest"
      responses:
        "200":
          description: Title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateNoteTitleResponse"
  /ai/tasks/extract:
    post:
      operationId: extractTasks
      tags: [ai]
      summary: Extract actionable tasks from text
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTasksRequest"
      responses:
        "200":
          description: Extracted tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTasksResponse"
  /ai/search/semantic:
    post:
      operationId: semanticSearch
      tags: [ai]
      summary: Semantic search over provided items
      description: Ranks items by embedding similarity (no persistence required)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticSearchRequest"
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticSearchResponse"
  /ai/dashboard/digest:
    post:
      operationId: dashboardDigest
      tags: [ai]
      summary: Daily dashboard digest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardDigestRequest"
      responses:
        "200":
          description: Digest text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDigestResponse"
  /ai/generate-work-note:
    post:
      operationId: generateWorkNote
      tags: [ai]
      summary: Generate IT work-note outputs from rough troubleshooting notes
      description: Uses only the provided text; does not automatically include the user's note library.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWorkNoteRequest"
      responses:
        "200":
          description: Work note variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateWorkNoteResponse"
  /notebooks:
    get:
      operationId: listNotebooks
      tags: [notebooks]
      summary: List notebooks for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notebooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookListResponse"
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallNote"
  /notes/bulk:
    post:
      operationId: bulkUpsertNotes
      tags: [notes]
      summary: Bulk create or update notes (import / migration)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkNotesRequest"
      responses:
        "200":
          description: Upserted notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
  /notes/import/enex:
    post:
      operationId: importEnexNotes
      tags: [notes]
      summary: Import notes from Evernote ENEX XML
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportEnexRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportEnexResponse"
        "400":
          description: No notes parsed from file
  /notes/{noteId}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a full note by id
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallNote"
        "404":
          description: Note not found
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallNote"
        "404":
          description: Note not found
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Note not found
  /capture:
    post:
      operationId: createCapture
      tags: [capture]
      summary: Capture a raw thought, task, reminder, or reference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaptureRequest"
      responses:
        "201":
          description: Created capture item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallCaptureItem"
  /capture/inbox:
    get:
      operationId: listCaptureInbox
      tags: [capture]
      summary: List pending AI Inbox capture items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Capture inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureInboxResponse"
  /capture/{captureId}:
    patch:
      operationId: updateCapture
      tags: [capture]
      summary: Update an AI Inbox capture item
      security:
        - bearerAuth: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaptureRequest"
      responses:
        "200":
          description: Updated capture item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallCaptureItem"
        "404":
          description: Capture item not found
  /capture/{captureId}/accept:
    post:
      operationId: acceptCapture
      tags: [capture]
      summary: Accept a capture item into notes or tasks
      security:
        - bearerAuth: []
      parameters:
        - name: captureId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCaptureRequest"
      responses:
        "200":
          description: Accepted capture item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptCaptureResponse"
        "404":
          description: Capture item not found
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallProject"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project summary
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallProject"
        "404":
          description: Project not found
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallTask"
  /tasks/bulk:
    post:
      operationId: bulkUpsertTasks
      tags: [tasks]
      summary: Bulk create or update tasks (migration)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTasksRequest"
      responses:
        "200":
          description: Upserted tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallTask"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Task not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
      required:
        - id
        - email
        - name
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - email
        - password
        - name
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiDegradedMeta:
      type: object
      properties:
        degraded:
          type: boolean
        degradedReason:
          type: string
          nullable: true
      required:
        - degraded
    AiStatus:
      allOf:
        - $ref: "#/components/schemas/AiDegradedMeta"
        - type: object
          properties:
            enabled:
              type: boolean
            model:
              type: string
              nullable: true
            embeddingModel:
              type: string
              nullable: true
          required:
            - enabled
    ChatRole:
      type: string
      enum: [system, user, assistant]
    ChatMessage:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string
      required:
        - role
        - content
    OpenNoteAction:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
      required:
        - id
        - title
    TaskContextItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
        priority:
          type: string
          enum: [high, med, medium, low, none]
        time:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - title
    NoteContextItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
          nullable: true
        preview:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - title
    AiContext:
      type: object
      properties:
        userName:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskContextItem"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteContextItem"
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          minItems: 1
        context:
          $ref: "#/components/schemas/AiContext"
      required:
        - messages
    ChatResponse:
      allOf:
        - $ref: "#/components/schemas/AiDegradedMeta"
        - type: object
          properties:
            message:
              $ref: "#/components/schemas/ChatMessage"
            model:
              type: string
              nullable: true
            openNote:
              allOf:
                - $ref: "#/components/schemas/OpenNoteAction"
              nullable: true
              description: When set, the client should navigate to this note instead of only showing the text reply.
          required:
            - message
    SummarizeNoteRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        maxLength:
          type: integer
          minimum: 50
          maximum: 2000
          default: 400
      required:
        - content
    SummarizeNoteResponse:
      allOf:
        - $ref: "#/components/schemas/AiDegradedMeta"
        - type: object
          properties:
            summary:
              type: string
          required:
            - summary
    GenerateNoteTitleRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
        - content
    GenerateNoteTitleResponse:
      allOf:
        - $ref: "#/components/schemas/AiDegradedMeta"
        - type: object
          properties:
            title:
              type: string
          required:
            - title
    ExtractedTask:
      type: object
      properties:
        title:
          type: string
        priority:
          type: string
          enum: [high, med, medium, low, none]
        time:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
      required:
        - title
    ExtractTasksRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
        - text
    ExtractTasksResponse:
      allOf:
        - $ref: "#/components/schemas/AiDegradedMeta"
        - type: object
          properties:
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/ExtractedTask"
          required:
            - tasks
    SemanticSearchItem:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        title:
          type: string
          nullable: true
      required:
        - id
        - text
    SemanticSearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/SemanticSearchItem"
          minItems: 1
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
      required:
        - query
        - items
    SemanticSearchResult:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        text:
          type: string
        score:
          type: number
      required:
        - id
        - text
        - score
    SemanticSearchResponse:
      allOf:
        - $ref: "#/components/schemas/AiDegradedMeta"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/SemanticSearchResult"
          required:
            - results
    DashboardDigestRequest:
      type: object
      properties:
        userName:
          type: string
          default: Ernesto
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskContextItem"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteContextItem"
    DashboardDigestResponse:
      allOf:
        - $ref: "#/components/schemas/AiDegradedMeta"
        - type: object
          properties:
            digest:
              type: string
            highlights:
              type: array
              items:
                type: string
          required:
            - digest
            - highlights
    GenerateWorkNoteRequest:
      type: object
      properties:
        rawText:
          type: string
          minLength: 1
        tone:
          type: string
          enum: [concise, friendly, technical]
          default: concise
      required:
        - rawText
    GenerateWorkNoteResponse:
      allOf:
        - $ref: "#/components/schemas/AiDegradedMeta"
        - type: object
          properties:
            internalWorkNote:
              type: string
            customerUpdate:
              type: string
            transferReason:
              type: string
            resolutionNote:
              type: string
            emailReply:
              type: string
          required:
            - internalWorkNote
            - customerUpdate
            - transferReason
            - resolutionNote
            - emailReply
    RecallProject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, paused, archived]
        relatedPeople:
          type: array
          items:
            type: string
        noteCount:
          type: integer
        taskCount:
          type: integer
        captureCount:
          type: integer
        attachmentCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - status
        - relatedPeople
        - noteCount
        - taskCount
        - captureCount
        - attachmentCount
        - createdAt
        - updatedAt
    ProjectListResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/RecallProject"
      required:
        - projects
    ProjectDetailResponse:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/RecallProject"
        notes:
          type: array

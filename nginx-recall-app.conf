# Nginx — recall-app.net (Recall)
# Install on droplet:
#   cp nginx-recall-app.conf /etc/nginx/sites-available/recall-app
#   ln -sf /etc/nginx/sites-available/recall-app /etc/nginx/sites-enabled/recall-app
#   nginx -t && systemctl reload nginx
#
# BEFORE enabling: remove recall-app.net from any other server block (e.g. abanoteassistant):
#   grep -r "recall-app" /etc/nginx/sites-enabled/
#
# SSL (if not already issued):
#   certbot --nginx -d recall-app.net -d www.recall-app.net

server {
    listen 80;
    listen [::]:80;
    server_name recall-app.net www.recall-app.net;

    location /.well-known/acme-challenge/ {
        root /var/www/recall-app/artifacts/recall-app/dist/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recall-app.net www.recall-app.net;

    ssl_certificate /etc/letsencrypt/live/recall-app.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recall-app.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (supplement Cloudflare)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api {
        proxy_pass http://127.0.0.1:5008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        root /var/www/recall-app/artifacts/recall-app/dist/public;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location /healthz {
        proxy_pass http://127.0.0.1:5008/api/healthz;
        access_log off;
    }
}
